[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "1.0.0"
description = "Search engine with inverted index, NumPy scoring, semantic/hybrid search (RRF), and FastAPI web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "matplotlib>=3.8.0",
    "py-spy>=0.3.14",
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "scalene>=1.5.44",
]

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
extraPaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]