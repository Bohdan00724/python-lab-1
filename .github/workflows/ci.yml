name: CI

on:
  push:
    branches: [main, "lab-*"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest --cov=findex --cov-report=term-missing