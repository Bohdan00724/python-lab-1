<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hired Employee Alert System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Hired Employee Alert</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4 text-center">
                <h3 class="mb-4">Вхід у систему</h3>
                
                <!-- Блок для вывода ошибки (если пароль неверный) -->
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <!-- Настоящая форма авторизации -->
                        <form action="/login" method="POST">
                            <div class="mb-3 text-start">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="hr@test.com" required>
                            </div>
                            <div class="mb-3 text-start">
                                <label class="form-label">Пароль</label>
                                <input type="password" name="password" class="form-control" placeholder="12345" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Увійти</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
