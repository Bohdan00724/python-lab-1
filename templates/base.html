<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Corporate Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">Corporate Portal</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Головна панель</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/employees">Структура компанії</a>
                    </li>
                    {% if session['role_id'] == 1 or session['role_id'] == 4 %}
                    <li class="nav-item">
                        <a class="nav-link" href="/equipment">Облік обладнання</a>
                    </li>
                    {% endif %}
                </ul>
                <a href="/logout" class="btn btn-sm btn-outline-light">Вийти</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
<!-- Цей скрипт потрібен для роботи вкладок (Tabs) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
